name: Toolkit checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --release --locked
      - run: python3 -B tools/test_observers.py
      - run: sh -n install.sh

  # mdx builds (and embeds the template) on every release platform.
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p mdx
      - run: target/debug/mdx guide port > /dev/null

  # The port template is a standalone workspace that template.create writes
  # out; it must build and pass its own tests.
  template:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/megadrive-bevy
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: templates/megadrive-bevy
      - run: cargo test --workspace --all-features --locked
      - run: cargo build -p engine --example sandbox --locked
